services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: lucca
      POSTGRES_PASSWORD: lucca
      POSTGRES_DB: llm_lucca
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lucca -d llm_lucca"]
      interval: 3s
      retries: 20
  # redis:
  #   image: redis:7
  #   ports: ["6379:6379"]
volumes:
  pgdata:
