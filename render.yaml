databases:
  - name: llm-lucca-db
    plan: free
    databaseName: llm_lucca
    user: llm_lucca
services:
  - type: web
    name: llm-lucca
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm -w apps/server exec prisma generate && npm run build
    preDeployCommand: npm -w apps/server run db:deploy
    startCommand: npm -w apps/server run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_MODE
        value: multi
      - key: HOST
        value: 0.0.0.0
      - key: SERVE_WEB
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: ALLOW_REGISTER
        value: "true"   # mude para "false" depois de criar sua conta
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: DATABASE_URL
        fromDatabase: { name: llm-lucca-db, property: connectionString }
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
